<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karanlık Orman - Hayatta Kalma</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background-color: #1e293b;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        .stat {
            background: rgba(15, 23, 42, 0.7);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .hidden {
            display: none !important;
        }
        #controls {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="ui">
        <div class="stat">Can: <span id="health">100</span></div>
        <div class="stat">Odun: <span id="wood">0</span></div>
        <div class="stat">Skor: <span id="score">0</span></div>
    </div>
    <div id="game-over" class="hidden">
        <h1 style="color: #ef4444;">Oyun Bitti!</h1>
        <p>Toplanan Odun: <span id="final-score">0</span></p>
        <button onclick="resetGame()">Yeniden Başla</button>
    </div>
</div>
<div id="controls">
    Kontroller: <b>W, A, S, D</b> veya <b>Yön Tuşları</b> ile hareket et. Ağaçlara dokunarak odun topla!
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const healthEl = document.getElementById('health');
    const woodEl = document.getElementById('wood');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');

    let player, keys, trees, enemies, woodCount, score, health, gameOver, spawnTimer;

    function init() {
        player = { x: 400, y: 250, size: 16, speed: 3 };
        keys = {};
        trees = [];
        enemies = [];
        woodCount = 0;
        score = 0;
        health = 100;
        gameOver = false;
        spawnTimer = 0;

        // Başlangıç ağaçları
        for (let i = 0; i < 8; i++) {
            spawnTree();
        }

        updateUI();
    }

    function spawnTree() {
        trees.push({
            x: Math.random() * (canvas.width - 40) + 20,
            y: Math.random() * (canvas.height - 40) + 20,
            size: 14
        });
    }

    function spawnEnemy() {
        const edge = Math.floor(Math.random() * 4);
        let x, y;
        if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
        else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
        else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
        else { x = -20; y = Math.random() * canvas.height; }

        enemies.push({ x, y, size: 12, speed: 1.5 + Math.random() * 0.8 });
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function update() {
        if (gameOver) return;

        // Oyuncu Hareketi
        if ((keys['w'] || keys['arrowup']) && player.y > player.size) player.y -= player.speed;
        if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.size) player.y += player.speed;
        if ((keys['a'] || keys['arrowleft']) && player.x > player.size) player.x -= player.speed;
        if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.size) player.x += player.speed;

        // Ağaç Toplama
        trees.forEach((tree, index) => {
            const dist = Math.hypot(player.x - tree.x, player.y - tree.y);
            if (dist < player.size + tree.size) {
                trees.splice(index, 1);
                woodCount++;
                score += 10;
                updateUI();
                spawnTree();
            }
        });

        // Düşman Mantığı ve Çarpışma
        spawnTimer++;
        if (spawnTimer % 120 === 0) {
            spawnEnemy();
        }

        enemies.forEach((enemy, index) => {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.x += Math.cos(angle) * enemy.speed;
            enemy.y += Math.sin(angle) * enemy.speed;

            const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
            if (dist < player.size + enemy.size) {
                health -= 10;
                enemies.splice(index, 1);
                updateUI();
                if (health <= 0) endGame();
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ağaçlar
        trees.forEach(tree => {
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(tree.x, tree.y, tree.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Düşmanlar
        enemies.forEach(enemy => {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Oyuncu
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fill();
    }

    function updateUI() {
        healthEl.textContent = health;
        woodEl.textContent = woodCount;
        scoreEl.textContent = score;
    }

    function endGame() {
        gameOver = true;
        finalScoreEl.textContent = woodCount;
        gameOverEl.classList.remove('hidden');
    }

    function resetGame() {
        gameOverEl.classList.add('hidden');
        init();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    init();
    loop();
</script>
</body>
</html>
