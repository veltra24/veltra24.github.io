<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltra AI x Yahya Mirza</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }
        #header {
            padding: 16px;
            background: #0f172a;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
        }
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background: #0f172a;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
            font-size: 14px;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 12px 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">🤖 Veltra AI x Yahya Mirza</div>
    <div id="chat-box">
        <div class="message ai">Merhaba! Ben Veltra AI. Yahya Mirza tarafından geliştirildim. Sana nasıl yardımcı olabilirim?</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Bir mesaj yazın..." onkeydown="handleKey(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    // Akıllı Doğal Dil İşleme (NLP) + Mantık Motoru
    function getSmartResponse(input) {
        const text = input.toLowerCase().trim();

        // Özel Kimlik Mantığı
        if (text.includes("sahibin kim") || text.includes("seni kim yaptı") || text.includes("geliştiricin kim") || text.includes("kim yaptı")) {
            return "Ben Veltra AI! Yahya Mirza tarafından geliştirildim.";
        }
        if (text.includes("adın ne") || text.includes("isim") || text.includes("sen kimsin")) {
            return "Ben Veltra AI. Yahya Mirza'nın geliştirdiği akıllı bir yapay zeka asistanıyım.";
        }

        // Matematiksel Hesaplama Motoru (Örn: 2+2, 5*10, 100/5)
        if (/^[0-9+\-*/.\s()]+$/.test(text) && /[0-9]/.test(text)) {
            try {
                const result = Function(`'use strict'; return (${text})`)();
                return `İşlemin sonucu: ${result}`;
            } catch (e) {
                return "Matematiksel işlemi hesaplarken bir hata oluştu.";
            }
        }

        // Genel Sohbet ve Bilgi Kuralları
        if (text.includes("selam") || text.includes("merhaba") || text.includes("sa")) {
            return "Sana da merhaba! Bugün sana nasıl yardımcı olabilirim?";
        }
        if (text.includes("nasılsın") || text.includes("nasıl gidiyor")) {
            return "Harikayım! Sistemlerim sorunsuz çalışıyor. Sen nasılsın?";
        }
        if (text.includes("saat kaç") || text.includes("saat")) {
            return `Şu anki saat: ${new Date().toLocaleTimeString('tr-TR')}`;
        }
        if (text.includes("tarih") || text.includes("hangi gündeyiz")) {
            return `Bugünün tarihi: ${new Date().toLocaleDateString('tr-TR')}`;
        }
        if (text.includes("teşekkür") || text.includes("sağol")) {
            return "Rica ederim! Her zaman yardıma hazırım.";
        }

        // Gelişmiş Dinamik Yanıtlar
        const generalResponses = [
            `"${input}" sorunu düşündüm. Yahya Mirza tarafından geliştirilen algoritmalarım ile sana en iyi desteği sağlamak için buradayım!`,
            "Bu konuda detaylı bilgi verebilirim. Başka ne öğrenmek istersin?",
            "Anladım! İhtiyacın olan başka bir konu veya işlem varsa sorabilirsin.",
            "Veltra AI olarak bu isteğini kaydettim. Sana başka nasıl yardımcı olabilirim?"
        ];

        return generalResponses[Math.floor(Math.random() * generalResponses.length)];
    }

    function appendMessage(sender, text) {
        const msg = document.createElement('div');
        msg.classList.add('message', sender);
        msg.textContent = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msg;
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        const aiMsg = appendMessage('ai', 'Düşünüyor...');

        setTimeout(() => {
            const reply = getSmartResponse(text);
            aiMsg.textContent = reply;
        }, 300);
    }
</script>

</body>
</html>
