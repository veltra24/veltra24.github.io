<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }
        #header {
            padding: 16px;
            background: #0f172a;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
        }
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background: #0f172a;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
            font-size: 14px;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 12px 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">🤖 Akıllı AI Asistan</div>
    <div id="chat-box">
        <div class="message ai">Merhaba! Ben senin yapay zeka asistanınım. Bana dilediğin soruyu sorabilirsin!</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Bir şeyler yazın..." onkeydown="handleKey(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function appendMessage(sender, text) {
        const msg = document.createElement('div');
        msg.classList.add('message', sender);
        msg.textContent = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msg;
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        const aiMsg = appendMessage('ai', 'Düşünüyor...');

        try {
            // Açık kaynaklı AI modeli çağrısı
            const response = await fetch("https://router.huggingface.co/hf-inference/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "Qwen/Qwen2.5-72B-Instruct",
                    messages: [{ role: "user", content: text }],
                    max_tokens: 500
                })
            });

            const data = await response.json();
            
            if (data.choices && data.choices[0].message) {
                aiMsg.textContent = data.choices[0].message.content;
            } else {
                aiMsg.textContent = "Şu an yanıt üretilemedi, lütfen tekrar dene.";
            }
        } catch (error) {
            aiMsg.textContent = "Bir bağlantı hatası oluştu. Lütfen internetini kontrol et.";
        }
    }
</script>

</body>
</html>
