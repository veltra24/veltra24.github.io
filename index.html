<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Asistanı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }
        #header {
            padding: 16px;
            background: #0f172a;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
        }
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background: #0f172a;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
            font-size: 14px;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 12px 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">🤖 Dahili AI Motoru</div>
    <div id="chat-box">
        <div class="message ai">Merhaba! Ben yerel olarak çalışan yapay zeka asistanınım. Bana soru sorabilir veya sohbet edebilirsin.</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Bir mesaj yazın..." onkeydown="handleKey(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    // Yapay Zeka Bilgi Tabanı ve Mantık Kuralları
    const knowledgeBase = [
        { keywords: ["selam", "merhaba", "sa", "hey"], response: "Merhaba! Sana nasıl yardımcı olabilirim?" },
        { keywords: ["nasılsın", "nasıl gidiyor", "neler yapıyorsun"], response: "Harikayım! Seninle sohbet etmeye ve sorularını yanıtlamaya hazırım." },
        { keywords: ["adın ne", "kimsin", "sen nesin"], response: "Ben JavaScript ile kodlanmış, doğrudan tarayıcında çalışan yerel bir yapay zeka modeliyim." },
        { keywords: ["github", "kod", "site"], response: "GitHub Pages üzerinde harika projeler oluşturabilirsin. HTML, CSS ve JS ile siteni yayınlayabilirsin." },
        { keywords: ["saat", "zaman"], response: () => `Şu anki saat: ${new Date().toLocaleTimeString('tr-TR')}` },
        { keywords: ["tarih", "gün"], response: () => `Bugünün tarihi: ${new Date().toLocaleDateString('tr-TR')}` },
        { keywords: ["teşekkür", "eyvallah", "sağol"], response: "Rica ederim! Her zaman yardıma hazırım." },
        { keywords: ["baybay", "görüşürüz", "hoşçakal"], response: "Görüşmek üzere! Kendine iyi bak." }
    ];

    function appendMessage(sender, text) {
        const msg = document.createElement('div');
        msg.classList.add('message', sender);
        msg.textContent = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function generateAIResponse(text) {
        const cleanText = text.toLowerCase().trim();
        
        for (const item of knowledgeBase) {
            for (const key of item.keywords) {
                if (cleanText.includes(key)) {
                    return typeof item.response === 'function' ? item.response() : item.response;
                }
            }
        }

        // Genel yanıtlar (Tanımlı anahtar kelime bulunamazsa)
        const fallbackResponses = [
            "Bu konuyu tam anlayamadım, biraz daha detay verebilir misin?",
            "Anladım, peki bu konuda ne yapmamı istersin?",
            "İlginç bir soru. Bunu biraz daha açıklar mısın?",
            "Şu an bu sorguyu işliyorum, başka bir şekilde ifade edebilir misin?"
        ];

        return fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        // Düşünme efekti
        setTimeout(() => {
            const aiResponse = generateAIResponse(text);
            appendMessage('ai', aiResponse);
        }, 400);
    }
</script>

</body>
</html>
