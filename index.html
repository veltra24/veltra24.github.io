<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .status-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .status-info { display: flex; align-items: center; gap: 10px; }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ef4444; /* Kapalı: Kırmızı */
        }
        .status-dot.online { background-color: #22c55e; } /* Açık: Yeşil */
        .status-dot.starting { background-color: #eab308; } /* Başlatılıyor: Sarı */
        
        .ip-box {
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px dashed #38bdf8;
        }
        .ip-text { font-family: monospace; font-size: 15px; color: #f8fafc; }
        .copy-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-start { background: #22c55e; }
        .btn-start:hover { background: #16a34a; }
        .btn-stop { background: #ef4444; }
        .btn-stop:hover { background: #dc2626; }
        .btn-restart { background: #eab308; }
        .btn-restart:hover { background: #ca8a04; }
        
        .console {
            background: #000;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #4ade80;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎮 Sunucu Paneli</h1>
        <p style="font-size: 13px; color: #94a3b8;">Bedrock Edition Survival Server</p>
    </div>

    <div class="status-card">
        <div class="status-info">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText" style="font-weight: bold;">Sunucu Kapalı</span>
        </div>
        <span id="playerCount" style="font-size: 13px; color: #94a3b8;">Oyuncu: 0/20</span>
    </div>

    <div class="ip-box">
        <span class="ip-text" id="serverIP">play.aternos.me:19132</span>
        <button class="copy-btn" onclick="copyIP()">KOPYALA</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-start" onclick="startServer()">Başlat</button>
        <button class="btn btn-restart" onclick="restartServer()">Yeniden Başlat</button>
        <button class="btn btn-stop" onclick="stopServer()">Durdur</button>
    </div>

    <div class="console" id="consoleLog">
        > Panel hazır.<br>
        > Komut bekleniyor...
    </div>
</div>

<script>
    let isOnline = false;

    function log(msg) {
        const consoleEl = document.getElementById('consoleLog');
        consoleEl.innerHTML += `<br>> ${msg}`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function startServer() {
        if (isOnline) {
            log("Sunucu zaten açık!");
            return;
        }
        log("Sunucu başlatılıyor...");
        document.getElementById('statusDot').className = "status-dot starting";
        document.getElementById('statusText').innerText = "Başlatılıyor...";

        setTimeout(() => {
            isOnline = true;
            document.getElementById('statusDot').className = "status-dot online";
            document.getElementById('statusText').innerText = "Sunucu Açık";
            document.getElementById('playerCount').innerText = "Oyuncu: 1/20";
            log("Sunucu başarıyla açıldı! (Port: 19132)");
        }, 3000);
    }

    function stopServer() {
        if (!isOnline) {
            log("Sunucu zaten kapalı.");
            return;
        }
        log("Sunucu kapatılıyor...");
        isOnline = false;
        document.getElementById('statusDot').className = "status-dot";
        document.getElementById('statusText').innerText = "Sunucu Kapalı";
        document.getElementById('playerCount').innerText = "Oyuncu: 0/20";
        log("Sunucu durduruldu.");
    }

    function restartServer() {
        log("Yeniden başlatma isteği gönderildi...");
        stopServer();
        setTimeout(() => {
            startServer();
        }, 1500);
    }

    function copyIP() {
        const ip = document.getElementById('serverIP').innerText;
        navigator.clipboard.writeText(ip);
        alert("Sunucu adresi kopyalandı: " + ip);
    }
</script>

</body>
</html>
