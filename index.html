<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Minecraft Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { overflow: hidden; font-family: sans-serif; background-color: #000; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-top: -5px;
            margin-left: -5px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
    <!-- 3D Grafik Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="crosshair">+</div>
<div id="instructions">
    <h2>Oyuna Başlamak İçin Tıkla</h2>
    <p><b>W, A, S, D</b>: Hareket Et</p>
    <p><b>Sol Tık</b>: Blok Kır</p>
    <p><b>Sağ Tık</b>: Blok Koy</p>
    <p><b>ESC</b>: Fareyi Serbest Bırak</p>
</div>

<script>
    let camera, scene, renderer;
    let controlsEnabled = false;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let yaw = 0, pitch = 0;
    const objects = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const instructions = document.getElementById('instructions');

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Gökyüzü rengi

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Blok Materyalleri
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const greenMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0x795548 });

        // Harita Oluşturma (16x16 zemin)
        for (let x = -8; x < 8; x++) {
            for (let z = -8; z < 8; z++) {
                const block = new THREE.Mesh(blockGeo, greenMat);
                block.position.set(x, 0, z);
                scene.add(block);
                objects.push(block);

                // Altına toprak katmanı
                const subBlock = new THREE.Mesh(blockGeo, dirtMat);
                subBlock.position.set(x, -1, z);
                scene.add(subBlock);
                objects.push(subBlock);
            }
        }

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Kontroller ve Etkileşimler
        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                controlsEnabled = true;
                instructions.style.display = 'none';
            } else {
                controlsEnabled = false;
                instructions.style.display = 'block';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!controlsEnabled) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        document.addEventListener('mousedown', (e) => {
            if (!controlsEnabled) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // Sol Tık (0): Blok Kır
                if (e.button === 0) {
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                } 
                // Sağ Tık (2): Blok Koy
                else if (e.button === 2) {
                    const newBlock = new THREE.Mesh(blockGeo, greenMat);
                    newBlock.position.copy(intersect.object.position).add(intersect.face.normal);
                    scene.add(newBlock);
                    objects.push(newBlock);
                }
            }
        });

        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);

        if (controlsEnabled) {
            // Kamera Yönü Hareketi
            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            const speed = 0.1;
            const dir = new THREE.Vector3();

            if (moveForward) dir.z -= 1;
            if (moveBackward) dir.z += 1;
            if (moveLeft) dir.x -= 1;
            if (moveRight) dir.x += 1;

            dir.normalize();
            dir.applyQuaternion(camera.quaternion);
            dir.y = 0; // Uçmayı engelle, zeminde yürü

            camera.position.addScaledVector(dir, speed);
        }

        renderer.render(scene, camera);
    }

    init();
    animate();
</script>
</body>
</html>
