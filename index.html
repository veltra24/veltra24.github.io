<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Traktör Sürüş Simülatörü</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #1e293b;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #87CEEB; /* Gökyüzü */
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Mobil Kontroller */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .btn-group { display: flex; gap: 15px; }
        .btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); }
        #score-board {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">🚜 Traktör Hızı: <span id="speed">0</span> km/h</div>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <div class="btn-group">
            <div class="btn" id="left">◄</div>
            <div class="btn" id="right">►</div>
        </div>
        <div class="btn-group">
            <div class="btn" style="background: #ef4444;" id="brake">Fren</div>
            <div class="btn" style="background: #22c55e;" id="gas">GAZ</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const speedText = document.getElementById('speed');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let tractor = {
        x: canvas.width / 2 - 30,
        y: canvas.height - 180,
        width: 60,
        height: 90,
        speed: 0,
        maxSpeed: 8,
        accel: 0.2,
        friction: 0.05,
        steer: 0
    };

    let keys = { left: false, right: false, gas: false, brake: false };

    // Dokunmatik Kontroller
    const bindTouch = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        el.addEventListener('mousedown', () => keys[key] = true);
        el.addEventListener('mouseup', () => keys[key] = false);
    };

    bindTouch('left', 'left');
    bindTouch('right', 'right');
    bindTouch('gas', 'gas');
    bindTouch('brake', 'brake');

    let roadOffset = 0;

    function drawField() {
        // Tarla & Yol Çizimi
        ctx.fillStyle = '#15803d'; // Yeşil çim
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Toprak Yol (Traktör Yolu)
        ctx.fillStyle = '#78350f';
        ctx.fillRect(canvas.width / 4, 0, canvas.width / 2, canvas.height);

        // Yol Çizgileri
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 6;
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -roadOffset;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
    }

    function drawTractor() {
        ctx.save();
        ctx.translate(tractor.x + tractor.width/2, tractor.y + tractor.height/2);
        
        // Gövde (Yeşil Traktör)
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(-25, -40, 50, 80);

        // Kabin
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-20, -10, 40, 35);

        // Büyük Arka Tekerlekler
        ctx.fillStyle = '#000';
        ctx.fillRect(-32, 10, 10, 30);
        ctx.fillRect(22, 10, 10, 30);

        // Küçük Ön Tekerlekler
        ctx.fillRect(-30, -35, 8, 20);
        ctx.fillRect(22, -35, 8, 20);

        // Egzoz
        ctx.fillStyle = '#475569';
        ctx.fillRect(10, -35, 5, 10);

        ctx.restore();
    }

    function update() {
        // Gaz & Fren
        if (keys.gas) {
            if (tractor.speed < tractor.maxSpeed) tractor.speed += tractor.accel;
        } else if (keys.brake) {
            if (tractor.speed > -3) tractor.speed -= tractor.accel;
        } else {
            if (tractor.speed > 0) tractor.speed -= tractor.friction;
            if (tractor.speed < 0) tractor.speed += tractor.friction;
            if (Math.abs(tractor.speed) < 0.1) tractor.speed = 0;
        }

        // Direksiyon
        if (keys.left && tractor.x > canvas.width / 4) tractor.x -= 4;
        if (keys.right && tractor.x < (canvas.width / 4 + canvas.width / 2) - tractor.width) tractor.x += 4;

        // Yol Hareketi
        roadOffset += tractor.speed * 2;
        speedText.innerText = Math.round(tractor.speed * 10);

        drawField();
        drawTractor();

        requestAnimationFrame(update);
    }

    update();
</script>

</body>
</html>
