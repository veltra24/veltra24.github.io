<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltra AI x Yahya Mirza</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }
        #header {
            padding: 16px;
            background: #0f172a;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
        }
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background: #0f172a;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
            font-size: 14px;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 12px 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">🤖 Veltra AI x Yahya Mirza</div>
    <div id="chat-box">
        <div class="message ai">Merhaba! Ben Veltra AI. Yahya Mirza tarafından geliştirildim. Sana nasıl yardımcı olabilirim?</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Bir mesaj yazın..." onkeydown="handleKey(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    // aistudio.google.com adresinden aldığın ücretsiz Gemini API anahtarını buraya yapıştır:
    const API_KEY = "AIzaSyD1x2Y3Z...";

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function appendMessage(sender, text) {
        const msg = document.createElement('div');
        msg.classList.add('message', sender);
        msg.textContent = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msg;
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        if (API_KEY === "BURAYA_GEMINI_API_KEY_YAZIN") {
            appendMessage('ai', 'Lütfen koddaki API_KEY alanına aistudio.google.com adresinden aldığın ücretsiz anahtarı yapıştır.');
            return;
        }

        const aiMsg = appendMessage('ai', 'Düşünüyor...');

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{ text: "Senin adın Veltra AI. Yahya Mirza tarafından geliştirildin. Her konuda son derece akıllı, mantıklı, samimi ve yardımsever yanıtlar verirsin." }]
                    },
                    contents: [
                        {
                            parts: [{ text: text }]
                        }
                    ]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                aiMsg.textContent = data.candidates[0].content.parts[0].text;
            } else {
                aiMsg.textContent = "Hata oluştu. API anahtarını kontrol et.";
            }
        } catch (error) {
            aiMsg.textContent = "Bağlantı hatası oluştu, lütfen tekrar dene.";
        }
    }
</script>

</body>
</html>
